image: atlassian/default-image:4

definitions:
  services:
    docker:
      memory: 2048

pipelines:
  branches:
    feature/payload-cms:

      - step:
          name: Build and Push Image to ECR
          oidc: true
          services:
            - docker

          script:
            # ============================================================
            # AWS OIDC
            # ============================================================

            - echo "===== AWS OIDC ====="
            - test -n "$BITBUCKET_STEP_OIDC_TOKEN"

            # No utilizar credenciales AWS estáticas
            - unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN

            - export AWS_ROLE_ARN=arn:aws:iam::638501454103:role/BitbucketEcsCicdLabs
            - export AWS_WEB_IDENTITY_TOKEN_FILE=$BITBUCKET_CLONE_DIR/web-identity-token

            - printf '%s' "$BITBUCKET_STEP_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"

            - echo "===== AWS IDENTITY ====="
            - aws sts get-caller-identity --query Arn --output text

            # ============================================================
            # Variables
            # ============================================================

            - export IMAGE_TAG="$BITBUCKET_COMMIT"
            - export ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
            - export ECR_IMAGE="$ECR_REGISTRY/ecs-cicd-lab:$IMAGE_TAG"

            # ============================================================
            # ECR LOGIN
            # ============================================================

            - echo "===== ECR LOGIN ====="
            - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            # ============================================================
            # BUILD
            # ============================================================

            - echo "===== DOCKER BUILD ====="
            - docker build ./payload-mongo -t "$ECR_IMAGE"

            # ============================================================
            # PUSH
            # ============================================================

            - echo "===== ECR PUSH ====="
            - docker push "$ECR_IMAGE"

            - echo "===== IMAGE ====="
            - echo "$ECR_IMAGE"


      - step:
          name: Deploy to ECS Fargate
          oidc: true

          script:
            # ============================================================
            # AWS OIDC
            # ============================================================

            - echo "===== AWS OIDC ====="
            - test -n "$BITBUCKET_STEP_OIDC_TOKEN"

            # No utilizar credenciales AWS estáticas
            - unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN

            - export AWS_ROLE_ARN=arn:aws:iam::638501454103:role/BitbucketEcsCicdLabs
            - export AWS_WEB_IDENTITY_TOKEN_FILE=$BITBUCKET_CLONE_DIR/web-identity-token

            - printf '%s' "$BITBUCKET_STEP_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"

            - echo "===== AWS IDENTITY ====="
            - aws sts get-caller-identity --query Arn --output text

            # ============================================================
            # Variables
            # ============================================================

            - export IMAGE_TAG="$BITBUCKET_COMMIT"
            - export ECR_IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/ecs-cicd-lab:$IMAGE_TAG"

            # ============================================================
            # CURRENT TASK DEFINITION
            # ============================================================

            - echo "===== CURRENT ECS TASK ====="
            - aws ecs describe-task-definition --task-definition ecs-cicd-lab --region "$AWS_DEFAULT_REGION" --query 'taskDefinition.[family,revision,containerDefinitions[0].image]' --output table

            # ============================================================
            # DOWNLOAD TASK DEFINITION
            # ============================================================

            - echo "===== DOWNLOAD TASK DEFINITION ====="
            - aws ecs describe-task-definition --task-definition ecs-cicd-lab --region "$AWS_DEFAULT_REGION" --query taskDefinition --output json > task-definition.json

            # ============================================================
            # CLEAN AWS GENERATED FIELDS
            # ============================================================

            - echo "===== CLEAN TASK DEFINITION ====="
            - jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' task-definition.json > clean-task-definition.json

            # ============================================================
            # UPDATE ONLY CONTAINER IMAGE
            # ============================================================

            - echo "===== UPDATE IMAGE ====="
            - jq --arg IMAGE "$ECR_IMAGE" '(.containerDefinitions[] | select(.name == "ecs-cicd-lab")).image = $IMAGE' clean-task-definition.json > new-task-definition.json

            # ============================================================
            # REGISTER NEW TASK DEFINITION
            # ============================================================

            - echo "===== REGISTER TASK DEFINITION ====="
            - export NEW_TASK_DEFINITION=$(aws ecs register-task-definition --cli-input-json file://new-task-definition.json --region "$AWS_DEFAULT_REGION" --query 'taskDefinition.taskDefinitionArn' --output text)

            - echo "New task definition: $NEW_TASK_DEFINITION"

            # ============================================================
            # UPDATE ECS SERVICE
            # ============================================================

            - echo "===== UPDATE ECS SERVICE ====="
            - aws ecs update-service --cluster ecs-lab --service ecs-cicd-lab-service --task-definition "$NEW_TASK_DEFINITION" --region "$AWS_DEFAULT_REGION"

            # ============================================================
            # WAIT FOR FARGATE DEPLOYMENT
            # ============================================================

            - echo "===== WAIT FOR ECS ====="
            - aws ecs wait services-stable --cluster ecs-lab --services ecs-cicd-lab-service --region "$AWS_DEFAULT_REGION"

            - echo "===== DEPLOYMENT SUCCESSFUL ====="
