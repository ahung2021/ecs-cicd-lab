image: atlassian/default-image:4

definitions:
  services:
    docker:
      memory: 2048

pipelines:
  branches:
    feature/payload-cms:

      - step:
          name: Build and Push Image to ECR
          services:
            - docker
          script:
            - curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
            - unzip -q awscliv2.zip
            - ./aws/install
            - aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
            - aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
            - aws configure set default.region "$AWS_DEFAULT_REGION"
            - aws sts get-caller-identity
            - export ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
            - export ECR_IMAGE="$ECR_REGISTRY/ecs-cicd-lab:$BITBUCKET_COMMIT"
            - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            - docker build ./payload-mongo -t "$ECR_IMAGE"
            - docker push "$ECR_IMAGE"
            - echo "$ECR_IMAGE"

      - step:
          name: Deploy to ECS
          script:
            - curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
            - unzip -q awscliv2.zip
            - ./aws/install
            - aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
            - aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
            - aws configure set default.region "$AWS_DEFAULT_REGION"
            - aws sts get-caller-identity
            - export ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
            - export ECR_IMAGE="$ECR_REGISTRY/ecs-cicd-lab:$BITBUCKET_COMMIT"
            - aws ecs describe-task-definition --task-definition ecs-cicd-lab --region "$AWS_DEFAULT_REGION" --query taskDefinition --output json > task-definition.json
            - jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' task-definition.json > clean-task-definition.json
            - jq --arg IMAGE "$ECR_IMAGE" '.containerDefinitions |= map(if .name == "ecs-cicd-lab" then .image = $IMAGE else . end)' clean-task-definition.json > new-task-definition.json
            - aws ecs register-task-definition --cli-input-json file://new-task-definition.json --region "$AWS_DEFAULT_REGION" --query 'taskDefinition.taskDefinitionArn' --output text > new-task-definition-arn.txt
            - export NEW_TASK_DEFINITION="$(cat new-task-definition-arn.txt)"
            - aws ecs update-service --cluster ecs-lab --service ecs-cicd-lab-service --task-definition "$NEW_TASK_DEFINITION" --region "$AWS_DEFAULT_REGION"
            - aws ecs wait services-stable --cluster ecs-lab --services ecs-cicd-lab-service --region "$AWS_DEFAULT_REGION"
            - echo "Deployment successful"
